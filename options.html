<!doctype html>
<html><head><meta charset="utf-8"><title>SelStats options</title>
<style>
  :root{color-scheme:light dark}
  body{font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:14px;min-width:300px;background:transparent;color:#222}
  .card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:18px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:14px 18px}
  h1{font-size:15px;margin:0 0 10px} h2{font-size:12px;font-weight:600;margin:12px 0 6px;opacity:.75;text-transform:uppercase;letter-spacing:.04em}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  label.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:999px;border:1px solid rgba(0,0,0,.12);cursor:pointer;user-select:none}
  label.chip:has(input:checked){background:#4a90e2;color:#fff;border-color:#4a90e2}
  .radio{display:block;margin:4px 0;cursor:pointer}
  #status{height:16px;font-size:12px;margin-top:10px;opacity:.7}
  @media (prefers-color-scheme:dark){body{color:#eee}.card{background:#2b2d31;border-color:rgba(255,255,255,.1)}label.chip{border-color:rgba(255,255,255,.18)}}
</style></head>
<body><div class="card">
  <h1>🧮 SelStats</h1>
  <h2>Copy these stats</h2>
  <div class="chips" id="fields"></div>
  <h2>Copy format</h2>
  <label class="radio"><input type="radio" name="format" value="line"> One line <small>(Sum: 1,234 Avg: 176.3)</small></label>
  <label class="radio"><input type="radio" name="format" value="tsv"> Tab-separated for spreadsheets</label>
  <div id="status"></div>
</div>
<script src="settings.js"></script><script src="options.js"></script>
</body></html>
